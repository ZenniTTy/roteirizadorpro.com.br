appId: br.com.roteirizadorpro.roteirizador_pro
---
# Smoke test for Area 4 (add stop via TEXT method) post-MS5 D4 fixes.
# Replaces the brittle integration_test/add_stop_flow_test.dart that assumed
# device pre-state. This YAML is self-contained: clears state, logs in,
# creates a route, exercises all 5 add-stop screen states, asserts the
# Spoke-parity invariants from inventory §10.21 + §11.4 (amended 2026-05-29).
#
# Run: maestro test apps/mobile/scripts/add_stop_text_flow.yaml
# Device: any logged-in Samsung M54 (or emulator with prod backend access).
# Credentials below are the same dev-only test pair used in validate_ui.yaml.

- clearState
- launchApp

# --- Login --------------------------------------------------------------
- assertVisible: "E-mail"
- tapOn: "seu@email.com"
- inputText: "teste@roteirizador.com.br"
- tapOn: "••••••••"
- inputText: "12345678"
- hideKeyboard
- tapOn: "Entrar"

# --- Wait for route shell to load (map + bottom sheet) ------------------
- extendedWaitUntil:
    visible: "Alternar para o mapa"
    timeout: 10000

# --- Create a route via drawer so we have an active route ---------------
- tapOn: "Abrir menu"
- assertVisible: "Criar rota"
- tapOn: "Criar rota"
- extendedWaitUntil:
    visible: "Salvar"
    timeout: 5000
- tapOn: "Salvar"

# --- Wait for shell with active route ----------------------------------
- extendedWaitUntil:
    visible: "Adicionar parada..."
    timeout: 5000

# --- ASSERTION 1: empty state (rota com 0 stops) -----------------------
# Spec Goal #2 + Q5: microcopy varies with stopCount.
- tapOn: "Adicionar parada..."
- extendedWaitUntil:
    visible: "Adicione as primeiras paradas para começar a criar sua rota"
    timeout: 3000
- assertVisible: "Mapa"
- assertVisible: "Leitor"
- assertVisible: "Voz"
- assertVisible: "Ler etiqueta de endereço"
- assertVisible: "Dite o endereço"

# --- ASSERTION 2: search bar morphs when typing (Spec Goal #4) ---------
# OCR + Voice disappear; only [input | Limpar X] remains.
- tapOn:
    id: ".*"
    text: "Adicione uma parada..."
- inputText: "Av Paulista"
- hideKeyboard
- assertNotVisible: "Ler etiqueta de endereço"
- assertNotVisible: "Dite o endereço"
- assertVisible: "Limpar"

# --- ASSERTION 3: results state with Section B + footer (Spec Goal #5+6)
- assertVisible: "Adicionar nova parada"
- assertVisible: "Escolher no mapa"

# --- ASSERTION 4: MS5 Task 1 — Footer is text-only (no chevron) -------
# Spoke parity §11.4 amendment item 7 (D4 2026-05-29).
# chevronRight icon should NOT appear on screen.
# (Maestro cannot directly assert absence of a Lucide icon by name;
#  closest proxy: hierarchy should show the footer label without an
#  adjacent ImageView. This is verified by the widget test
#  `'WithResults footer has no trailing chevron icon'`.)

# --- ASSERTION 5: Section B tap creates stop + pops to shell -----------
# Spec Goal #7. Tap the first non-Section-A result.
- tapOn:
    text: "Avenida Paulista.*"
    index: 0
- extendedWaitUntil:
    visible: "Adicionar parada..."
    timeout: 5000

# --- ASSERTION 6: re-open add-stop → Section A now exists (Spec Q3) ----
# Rota agora tem 1 stop. Buscar "Paulista" → Section A "Desta rota (1)"
# aparece.
- tapOn: "Adicionar parada..."
- tapOn:
    id: ".*"
    text: "Adicione uma parada..."
- inputText: "Paulista"
- hideKeyboard
- assertVisible:
    text: "Desta rota \\(1\\)"

# --- ASSERTION 7: MS5 Task 2 — Section A tap = SnackBar stub (Q3) -----
# Tap on the Section A row (the one with Av Paulista already added).
- tapOn:
    text: ".*Av\\. Paulista.*"
- extendedWaitUntil:
    visible: "Editar parada em breve"
    timeout: 3000

# --- ASSERTION 8: MS5 Task 3 — X = clear input (Spec Goal #10) --------
# Currently typing "Paulista" → tap X (tooltip "Limpar") → empty state.
- tapOn: "Limpar"
- extendedWaitUntil:
    visible: "Adicione novas paradas ou encontre paradas na rota"
    timeout: 3000
- assertVisible: "Ler etiqueta de endereço"
- assertVisible: "Dite o endereço"

# --- ASSERTION 9: Android back = pops to shell (Spec Goal #11) --------
- back
- assertVisible: "Adicionar parada..."

# Done. Smoke covers MS1+MS2+MS3+MS5 D4-aligned behaviors end-to-end.
