name: roteirizador_pro
description: Roteirizador Pro — route planner for Brazilian delivery riders.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  speech_to_text: ^7.3.0
  google_mlkit_text_recognition: ^0.15.1
  lucide_icons_flutter: ^3.1.14
  share_plus: ^12.0.2
  font_awesome_flutter: ^10.12.0
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  # Direct dep so tests can use InMemorySharedPreferencesAsync substrate.
  shared_preferences_platform_interface: ^2.4.2
  # Mock library — no codegen, used by flutter-test-author subagent (ADR-0025).
  mocktail: ^1.0.5
  # Golden-test toolkit (ADR-0029). Spec drafted with golden_toolkit but that
  # package is discontinued by eBay; pivoted to alchemist (Betterment + VGV).
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google-g.svg
