# Roteirizador Pro — Nginx reverse proxy for the API.
#
# Pre-Certbot HTTP-only template. After dropping this file at
# /etc/nginx/sites-available/api.roteirizadorpro.com.br and symlinking it
# from /etc/nginx/sites-enabled/, run:
#
#   sudo certbot --nginx -d api.roteirizadorpro.com.br
#
# Certbot edits this file in place — it adds the listen 443 ssl block, the
# certificate paths, and a redirect from 80 → 443. Don't pre-bake the SSL
# block or Certbot's --nginx plugin will fail to find the right insertion
# point.

server {
    listen 80;
    listen [::]:80;
    server_name api.roteirizadorpro.com.br;

    # Body size — auth + route requests are tiny; bump only if /routes/optimize
    # ever grows large stop payloads.
    client_max_body_size 1m;

    # gzip — the typical 95% of responses are JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain;

    # Reverse proxy → Fastify backend on the host (systemd unit).
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Connection keep-alive to the upstream — reduces TCP churn for
        # the always-on mobile clients.
        proxy_set_header   Connection        "";

        # Sensible timeouts for an API that occasionally proxies routing
        # requests to GraphHopper.
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # Block exposing internal directories or hidden files (defense in depth —
    # there shouldn't be any served from "/" anyway, the backend handles it).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Return 444 (close connection) for hosts that don't match — no info leak.
    # Nginx will only enter this server block when the Host header matches.
}
