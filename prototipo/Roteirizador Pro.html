<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roteirizador Pro · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Poppins', system-ui, sans-serif; background: #f0eee9; }
  * { box-sizing: border-box; }
  @keyframes rpPulse {
    0% { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  @keyframes rpPulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  @keyframes rpDash { to { stroke-dashoffset: -20; } }
  @keyframes rpFade {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tokens.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="screens-c.jsx"></script>
<script type="text/babel" src="screens-d.jsx"></script>
<script type="text/babel" src="screens-e.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  // Cross-artboard navigation: clicking a CTA focuses the target artboard.
  const goto = (target) => {
    window.dispatchEvent(new CustomEvent('dc-focus-artboard', { detail: { id: target } }));
  };

  // Helper to keep markup compact — returns a real DCArtboard element
  // (DesignCanvas filters its section children by type === DCArtboard).
  const AB = (id, label, Screen) => (
    <DCArtboard id={id} label={label} width={390} height={844}>
      <Screen goto={goto}/>
    </DCArtboard>
  );

  return (
    <DesignCanvas
      title="Roteirizador Pro"
      subtitle="Android prototype · 12 screens · roxo, Poppins, minimalista"
    >
      <DCSection id="auth" title="01 · Autenticação" subtitle="Login, criar conta">
        {AB('login', '01 · Login', ScreenLogin)}
        {AB('register', '02 · Criar conta', ScreenRegister)}
      </DCSection>

      <DCSection id="home" title="02 · Rota" subtitle="Estados da home + mapa + adicionar parada">
        {AB('home-empty', '03 · Home vazia', ScreenHomeEmpty)}
        {AB('home-list', '04 · Lista de paradas', ScreenHomeList)}
        {AB('map-stops', '05 · Mapa da rota', ScreenMapStops)}
        {AB('add-stops-map', '06 · Adicionar pelo mapa', ScreenAddStopsMap)}
        {AB('add-stop', '07 · Adicionar (busca)', ScreenAddStop)}
        {AB('edit-stop', '08 · Editar parada', ScreenEditStop)}
      </DCSection>

      <DCSection id="capture" title="03 · Captura de endereço" subtitle="Voz, OCR, otimização">
        {AB('voice', '09 · Voz', ScreenVoice)}
        {AB('ocr', '10 · Scanner OCR', ScreenOCR)}
        {AB('optimize-loading', '11 · Otimizando rota', ScreenOptimize)}
        {AB('optimize', '12 · Rota otimizada', ScreenOptimizeRoute)}
        {AB('reorder', '13 · Reordenar (laço)', ScreenReorder)}
      </DCSection>

      <DCSection id="delivery" title="04 · Entrega + assinatura" subtitle="Detalhe, navegação, conclusão, paywall">
        {AB('stop-detail', '14 · Detalhe da parada', ScreenStopDetail)}
        {AB('navigate', '15 · Navegação turn-by-turn', ScreenNavigate)}
        {AB('route-complete', '16 · Rota concluída', ScreenRouteComplete)}
        {AB('paywall', '17 · Paywall (Pix)', ScreenPaywall)}
      </DCSection>

      <DCSection id="account" title="05 · Conta" subtitle="Configurações, indicação">
        {AB('settings', '18 · Configurações', ScreenSettings)}
        {AB('share', '19 · Indique o app', ScreenShare)}
      </DCSection>

      <DCSection id="components" title="06 · Componentes" subtitle="Botões, cards, badges, inputs">
        {AB('components', 'Library', ScreenComponents)}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
